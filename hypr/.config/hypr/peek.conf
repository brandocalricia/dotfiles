# peek — floating screen-aware Claude assistant.
#
# A Wayland client cannot float, pin, or place itself; the compositor owns all
# of that. So everything that makes peek feel like an overlay lives here rather
# than in the app. Host-agnostic on purpose — it works the same on the
# dual-monitor desktop and the single-panel laptop.
#
# Syntax note: Hyprland 0.55 wants `<prop> <value>, match:class ^(...)$`.
# The older `float, class:^(...)$` form parses as "missing a value" and is
# silently dropped except for a line in `hyprctl configerrors`.

windowrule = float on,        match:class ^(dev\.brandon\.peek)$
windowrule = pin on,          match:class ^(dev\.brandon\.peek)$
windowrule = size 620 460,    match:class ^(dev\.brandon\.peek)$
windowrule = rounding 12,     match:class ^(dev\.brandon\.peek)$
windowrule = opacity 0.97 0.94, match:class ^(dev\.brandon\.peek)$
# (no border rule: neither `noborder` nor `bordersize` is a valid field type on
# 0.55 — the themed border is fine, and rounding + opacity carry the look.)

# Deliberately NOT `stayfocused`: that pins keyboard focus to peek permanently
# and traps you inside it. peek takes focus when summoned and releases on Esc.

# SUPER+A summons or hides it. The launcher handles start/focus/hide so one bind
# does everything; SUPER+SHIFT+A opens straight into region-select capture.
bind = SUPER, A, exec, ~/code/peek/peek-toggle.sh
bind = SUPER SHIFT, A, exec, ~/code/peek/peek-toggle.sh --region

# Keeps a last-seen snapshot of every workspace, since Wayland cannot capture a
# workspace that isn't currently displayed.
exec-once = ~/code/peek/peek-watch.sh
