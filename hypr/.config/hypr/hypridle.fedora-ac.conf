# fedora (Framework 13) — on power adapter.
# Matches this Mac: display sleeps at 10 min (touch wakes it, no password).
# Lock only on actual sleep (lid or the 11 min suspend). Battery profile is
# hypridle.fedora-battery.conf (2 / 3 min). run-hypridle.sh picks.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    # Caffeine-off is the keep-awake switch. Logind idle blocks (Grok agent
    # turns and similar) must not veto the display-off and suspend timers.
    ignore_systemd_inhibit = true
}

# 9.5 min: dim like macOS halfdim, just before the display sleeps
listener {
    timeout = 570
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 10 min: display off, no lock — click/touch brings it back immediately
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off; brightnessctl -sd chromeos::kbd_backlight set 0
    on-resume = hyprctl dispatch dpms on; brightnessctl -rd chromeos::kbd_backlight
}

# 11 min: suspend (pmset sleep 1 = one minute after display sleep)
listener {
    timeout = 660
    on-timeout = systemctl suspend
}
