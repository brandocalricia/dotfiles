# GB workers as one tabbed group on workspace 1 (Brandon t464u). Sourced from hyprland.conf.
# Super+Tab / Super+Shift+Tab = next/prev worker tab, Super+G = group/ungroup,
# Super+Ctrl+1..7 = jump to worker tab N. Re-group anytime: ~/.local/bin/gb-group.py
group {
    auto_group = true
    insert_after_current = false
    col.border_active = rgba(ffffff40)
    col.border_inactive = rgba(ffffff14)
    col.border_locked_active = rgba(ffffff40)
    col.border_locked_inactive = rgba(ffffff14)
    groupbar {
        disable_when_only = true
        enabled = true
        font_family = JetBrainsMono Nerd Font
        font_size = 12
        height = 22
        gradients = true
        render_titles = true
        rounding = 6
        gradient_rounding = 6
        indicator_height = 0
        keep_upper_gap = false
        gaps_in = 3
        gaps_out = 3
        text_color = rgba(e6e6e6ff)
        font_weight_active = bold
        col.active = rgba(3a3f4bee)
        col.inactive = rgba(1a1c22cc)
        col.locked_active = rgba(3a3f4bee)
        col.locked_inactive = rgba(1a1c22cc)
    }
}
bind = SUPER, Tab, changegroupactive, f
bind = SUPER SHIFT, Tab, changegroupactive, b
bind = SUPER, G, togglegroup
bind = SUPER CTRL, 1, changegroupactive, 1
bind = SUPER CTRL, 2, changegroupactive, 2
bind = SUPER CTRL, 3, changegroupactive, 3
bind = SUPER CTRL, 4, changegroupactive, 4
bind = SUPER CTRL, 5, changegroupactive, 5
bind = SUPER CTRL, 6, changegroupactive, 6
bind = SUPER CTRL, 7, changegroupactive, 7

# Bring the GB worker console back after login/reboot: disabled 2026-10-14.
# Agent City stays off. Restore by uncommenting the exec-once line.
# exec-once = sleep 20 && ~/.local/bin/gb-zellij.py up
