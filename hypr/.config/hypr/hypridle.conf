general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min: turn off display
# YouTube/Crunchyroll hold a zwp_idle_inhibitor (and dbus ScreenSaver inhibit).
# ignore_inhibit so walking away still blanks the screens.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
    ignore_inhibit = true
}

# 5 min + 5s: lock screen (slight delay so dpms off registers first)
listener {
    timeout = 305
    on-timeout = pidof hyprlock || hyprlock
    ignore_inhibit = true
}

# 15 min: suspend to RAM
# Left honoring inhibitors so playing media can keep the box awake for audio.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
