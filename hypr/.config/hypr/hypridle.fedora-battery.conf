# fedora (Framework 13) — on battery.
# Matches this Mac: display sleeps at 2 min (touch wakes it, no password).
# Lock only on actual sleep (lid or the 3 min suspend). AC profile is
# hypridle.fedora-ac.conf (10 / 11 min). run-hypridle.sh picks.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1.5 min: dim like macOS halfdim, just before the display sleeps
listener {
    timeout = 90
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 2 min: display off, no lock — click/touch brings it back immediately
listener {
    timeout = 120
    on-timeout = hyprctl dispatch dpms off; brightnessctl -sd chromeos::kbd_backlight set 0
    on-resume = hyprctl dispatch dpms on; brightnessctl -rd chromeos::kbd_backlight
}

# 3 min: suspend (pmset sleep 1 = one minute after display sleep)
listener {
    timeout = 180
    on-timeout = systemctl suspend
}
