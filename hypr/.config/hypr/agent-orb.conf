# agent-orb — thinking-orbs island under Waybar while a terminal agent is mid-turn.
# Hidden when idle. No exclusive zone, no Waybar changes, no reserved monitor space.

windowrule = float on,             match:class ^(dev\.brandon\.agent-orb)$
windowrule = pin on,               match:class ^(dev\.brandon\.agent-orb)$
windowrule = no_initial_focus on,  match:class ^(dev\.brandon\.agent-orb)$
windowrule = no_follow_mouse on,   match:class ^(dev\.brandon\.agent-orb)$
windowrule = rounding 14,          match:class ^(dev\.brandon\.agent-orb)$
windowrule = border_size 0,        match:class ^(dev\.brandon\.agent-orb)$
windowrule = no_anim on,           match:class ^(dev\.brandon\.agent-orb)$
windowrule = no_shadow on,         match:class ^(dev\.brandon\.agent-orb)$
windowrule = size 268 88,          match:class ^(dev\.brandon\.agent-orb)$
windowrule = move 100%-w-12 50,    match:class ^(dev\.brandon\.agent-orb)$

exec-once = /usr/bin/python3 /home/brandonrobertniehaus/code/agent-orb/agent-orb.py
